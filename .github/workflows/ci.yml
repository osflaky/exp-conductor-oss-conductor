name: CI

on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ 
    github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: windows-latest
          java: 21
          arch: arm64
          runner: windows-11-arm
          expander_leg: windows-latest-21-arm64
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
    - name: Gradle wrapper validation
      uses: gradle/wrapper-validation-action@v3
    - name: Set up Zulu JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: "zulu"
        java-version: "${{ matrix.java }}"
    - name: Cache SonarCloud packages
      uses: actions/cache@v5
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar
    - name: Cache Gradle packages
      uses: actions/cache@v5
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', 
          '**/gradle-wrapper.properties') }}
        restore-keys: ${{ runner.os }}-gradle-
    - name: Build with Gradle
      if: github.event_name != 'push' || github.ref != 'refs/heads/main'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        ./gradlew build -x :conductor-test-harness:test -x test
    - name: Build and Publish snapshot
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        echo "Running build for commit ${{ github.sha }}"
        ./gradlew build -x :conductor-test-harness:test -x test
    - name: Generate aggregated coverage report
      if: always()
      run: ./gradlew jacocoAggregatedReport -x test || true
    - name: Publish Test Report
      uses: mikepenz/action-junit-report@v6
      if: always()
      with:
        report_paths: "**/build/test-results/test/TEST-*.xml"
    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: build-artifacts
        path: "**/build/reports"
    - name: Upload coverage report
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: coverage-report
        path: build/reports/jacoco/aggregated
    name: build [${{ matrix.expander_leg }}]
    timeout-minutes: 150
