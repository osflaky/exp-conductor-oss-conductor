name: CI

on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ 
    github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          java: 21
          arch: arm64
          runner: macos-latest
          expander_leg: macos-latest-21-arm64
    runs-on: ${{ matrix.runner }}
    # checks: write is required for the test-result check below; without it the
    # default read-only token fails with "Resource not accessible by integration".
    permissions:
      contents: read
      checks: write
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0
      # sudo and these Unix paths do not exist on Windows runners; running this
      # there fails the job before the JDK is set up, which leaves Gradle without
      # a Java 21 toolchain.
    - name: Free disk space
      if: runner.os != 'Windows'
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
    - name: Gradle wrapper validation
      uses: gradle/wrapper-validation-action@v3
    - name: Set up Zulu JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: "zulu"
        java-version: "${{ matrix.java }}"
    - name: Cache SonarCloud packages
      uses: actions/cache@v5
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar
    - name: Cache Gradle packages
      uses: actions/cache@v5
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', 
          '**/gradle-wrapper.properties') }}
        restore-keys: ${{ runner.os }}-gradle-
    - name: Build with Gradle
      if: github.event_name != 'push' || github.ref != 'refs/heads/main'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        ./gradlew build -x :conductor-test-harness:test -x test
    - name: Build and Publish snapshot
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        echo "Running build for commit ${{ github.sha }}"
        ./gradlew build -x :conductor-test-harness:test -x test
    - name: Generate aggregated coverage report
      if: always()
        # `|| true` is not valid in PowerShell (the Windows default shell), so
        # tolerate failures with continue-on-error instead.
      continue-on-error: true
      run: ./gradlew jacocoAggregatedReport -x test
    - name: Publish Test Report
      uses: mikepenz/action-junit-report@v6
      if: always()
      with:
        report_paths: "**/build/test-results/test/TEST-*.xml"
    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: build-artifacts-${{ matrix.os }}-java${{ matrix.java }}-${{ 
          matrix.arch }}
        path: "**/build/reports"
    - name: Upload coverage report
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: coverage-report-${{ matrix.os }}-java${{ matrix.java }}-${{ 
          matrix.arch }}
        path: build/reports/jacoco/aggregated
    name: build [${{ matrix.expander_leg }}]
    timeout-minutes: 150
